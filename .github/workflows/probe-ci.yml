name: probe-ci

on:
  push:
    branches: [master, dev]
    paths:
      - 'probe/**'
      - '.github/workflows/probe-ci.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [master, dev]
    paths:
      - 'probe/**'
      - '.github/workflows/probe-ci.yml'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cheburspeed-probe
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  ruff:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.x'
          enable-cache: true

      - name: Sync probe deps
        working-directory: probe
        run: uv sync --frozen

      - name: Ruff check
        working-directory: probe
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: probe
        run: uv run ruff format --check .

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.x'
          enable-cache: true

      - name: Sync probe deps
        working-directory: probe
        run: uv sync --frozen --all-extras

      - name: Run tests
        working-directory: probe
        run: uv run pytest

  go-test:
    name: go vet + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # Must match the `go` directive in probe/awgproxy/go.mod.
          go-version: '1.25'
          cache-dependency-path: probe/awgproxy/go.sum

      - name: Vet
        working-directory: probe/awgproxy
        run: go vet ./...

      - name: Test
        working-directory: probe/awgproxy
        run: go test ./...

  docker:
    name: multi-arch build
    runs-on: ubuntu-latest
    needs: [ruff, pytest, go-test]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build multi-arch (push on master/dev)
        uses: docker/build-push-action@v6
        with:
          context: ./probe
          file: ./probe/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify multi-arch manifest
        if: github.event_name == 'push'
        run: docker buildx imagetools inspect ${{ env.IMAGE_NAME }}:latest
