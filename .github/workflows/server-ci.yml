name: server-ci

on:
  push:
    branches: [master, dev]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
      - 'pyproject.toml'
      - 'uv.lock'
  pull_request:
    branches: [master, dev]
    paths:
      - 'server/**'
      - '.github/workflows/server-ci.yml'
      - 'pyproject.toml'
      - 'uv.lock'

env:
  PYTHON_VERSION: '3.12'
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/cheburspeed-server

jobs:
  ruff:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.x'
          enable-cache: true

      - name: Sync server deps
        working-directory: server
        run: uv sync --frozen

      - name: Ruff check
        working-directory: server
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: server
        run: uv run ruff format --check .

  mypy:
    name: mypy typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.x'
          enable-cache: true

      - name: Sync server deps
        working-directory: server
        run: uv sync --frozen

      - name: mypy
        working-directory: server
        run: uv run mypy src/xspeed_server

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: xspeed
          POSTGRES_PASSWORD: xspeed
          POSTGRES_DB: xspeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xspeed -d xspeed"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://xspeed:xspeed@localhost:5432/xspeed
      JWT_SECRET: ci-secret-do-not-use-anywhere-else-32chars
      WS_HOST: ws://localhost:8000/ws
      FRONTEND_ORIGIN: http://localhost:3000
      LOG_LEVEL: INFO
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: '0.5.x'
          enable-cache: true

      - name: Sync server deps
        working-directory: server
        run: uv sync --frozen --all-extras

      - name: Wait for Postgres
        run: |
          for i in {1..30}; do
            pg_isready -h localhost -p 5432 -U xspeed && break
            sleep 1
          done

      - name: Apply migrations
        working-directory: server
        run: uv run alembic upgrade head

      - name: Run tests with coverage
        working-directory: server
        run: |
          uv run pytest \
            --cov=src/xspeed_server \
            --cov-report=xml \
            --cov-report=term-missing

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-server
          path: server/coverage.xml
          retention-days: 14

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: [ruff, mypy, pytest]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (push on master/dev)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
