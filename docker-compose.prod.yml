# Production stack for CheburSpeed — provides HTTPS via certbot, restart=always,
# healthchecks on every service and a long-running certbot renewer.
#
# Usage:
#   1. cp .env.prod.example .env.prod && edit values
#   2. docker compose -f docker-compose.prod.yml --env-file .env.prod pull
#   3. docker compose -f docker-compose.prod.yml --env-file .env.prod \
#        --profile init run --rm certbot-init
#   4. docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Override image tags with XSPEED_VERSION (defaults to :latest).
name: xspeed-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xspeed_net

  server:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-gorcer}/cheburspeed-server:${XSPEED_VERSION:-latest}
    restart: always
    pull_policy: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      WS_HOST: ${WS_HOST:?WS_HOST is required}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DOCS: ${ENABLE_DOCS:-false}
      RATE_LIMIT_TASK_CREATE_PER_HOUR: ${RATE_LIMIT_TASK_CREATE_PER_HOUR:-100}
      RATE_LIMIT_TASK_READ_PER_MINUTE: ${RATE_LIMIT_TASK_READ_PER_MINUTE:-1000}
      RATE_LIMIT_TASK_LIST_PER_MINUTE: ${RATE_LIMIT_TASK_LIST_PER_MINUTE:-1000}
      RATE_LIMIT_ADMIN_LOGIN_PER_MINUTE: ${RATE_LIMIT_ADMIN_LOGIN_PER_MINUTE:-100}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xspeed_net

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY_OWNER:-gorcer}/cheburspeed-frontend:${XSPEED_VERSION:-latest}
    restart: always
    pull_policy: always
    depends_on:
      - server
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xspeed_net

  certbot:
    image: certbot/certbot:v2.11.0
    restart: always
    depends_on:
      nginx:
        condition: service_started
    volumes:
      - ./nginx/certbot/www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"
    networks:
      - xspeed_net

  certbot-init:
    image: certbot/certbot:v2.11.0
    profiles: ["init"]
    volumes:
      - ./nginx/certbot/www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    security_opt:
      - no-new-privileges:true
    entrypoint: /bin/sh -c "certbot certonly --webroot -w /var/www/certbot --email ${CERTBOT_EMAIL:?CERTBOT_EMAIL is required} --agree-tos --no-eff-email -d ${NGINX_SERVER_NAME:?NGINX_SERVER_NAME is required}"
    networks:
      - xspeed_net

  nginx:
    image: nginx:1.27-alpine
    restart: always
    depends_on:
      - server
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx-prod.conf.template:/etc/nginx/templates/nginx-prod.conf.template:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    command:
      - /bin/sh
      - -c
      - |
        envsubst '$$NGINX_SERVER_NAME' \
          < /etc/nginx/templates/nginx-prod.conf.template \
          > /etc/nginx/nginx.conf && \
        nginx -t && \
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet https://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    # nginx needs writable work directories at startup even with the
    # read-only rootfs; drop ALL but the minimum it actually needs
    # (NET_BIND_SERVICE, CHOWN, DAC_OVERRIDE for the work tree).
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xspeed_net

volumes:
  postgres_data:
    driver: local
  certbot_conf:
    driver: local

networks:
  xspeed_net:
    driver: bridge
