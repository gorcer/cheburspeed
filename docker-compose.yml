name: xspeed

services:
  postgres:
    image: postgres:16
    container_name: xspeed-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-xspeed}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-xspeed}
      POSTGRES_DB: ${POSTGRES_DB:-xspeed}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-xspeed} -d ${POSTGRES_DB:-xspeed}"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xspeed_net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: xspeed-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-xspeed}:${POSTGRES_PASSWORD:-xspeed}@postgres:5432/${POSTGRES_DB:-xspeed}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      WS_HOST: ${WS_HOST:-ws://localhost}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ENABLE_DOCS: ${ENABLE_DOCS:-true}
    expose:
      - "8000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xspeed_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xspeed-frontend
    restart: unless-stopped
    depends_on:
      - server
    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xspeed_net

  nginx:
    image: nginx:1.27-alpine
    container_name: xspeed-nginx
    restart: unless-stopped
    depends_on:
      - server
      - frontend
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - xspeed_net

networks:
  xspeed_net:
    driver: bridge

volumes:
  postgres_data:
    driver: local