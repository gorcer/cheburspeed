# CheburSpeed upstreams — included from nginx.conf http {} block.
#
# The docker-compose.df3.yml stack runs server + frontend with
# network_mode=host, so the listed ports are bound on the host's
# network namespace and reachable as plain localhost addresses
# from the system nginx worker process.

upstream cheburspeed_server {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream cheburspeed_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}
