# Bare ACME-webroot server for che.dataforest.app.
# Active ONLY while issuing/renewing the first certificate. Replace
# with cheburspeed.conf (full reverse-proxy config) once
# /etc/letsencrypt/live/che.dataforest.app/{fullchain,privkey}.pem
# exist. See deploy_server.sh for the toggle step.

server {
    listen 80;
    listen [::]:80;
    server_name che.dataforest.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
