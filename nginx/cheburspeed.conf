server {
    server_name che.dataforest.app;

    client_max_body_size 10m;

    # WebSocket — keep timeouts long so idle probe connections survive.
    # Match both ``/ws`` (the canonical server endpoint) and any
    # ``/ws/*`` prefix so the upstream-issued redirect would only be
    # cosmetic. The server registers the route at ``/ws`` (no trailing
    # slash); nginx must not rewrite that.
    location = /ws {
        proxy_pass         http://cheburspeed_server;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    location /ws/ {
        proxy_pass         http://cheburspeed_server;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /api/ {
        proxy_pass         http://cheburspeed_server;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass         http://cheburspeed_frontend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # --- Certificate paths (managed by certbot on df3) -------
    # Defaults to the production TLS material issued for this
    # domain. ``deploy_server.sh`` installs a stub ``selfsigned.pem``
    # under ``/etc/letsencrypt/live/che.dataforest.app/`` so this
    # block can be enabled while waiting for the first Let's Encrypt
    # issuance — swap to fullchain.pem + privkey.pem afterwards.
    ssl_certificate     /etc/letsencrypt/live/che.dataforest.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/che.dataforest.app/privkey.pem;

    listen 443 ssl;
}

# ACME-webroot + redirect. Matches DAT-167 ACME scheme used by the
# neighbouring dataforest.app subdomains on this host.
server {
    listen 80;
    listen [::]:80;
    server_name che.dataforest.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
