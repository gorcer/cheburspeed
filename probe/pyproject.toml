[project]
name = "xspeed-probe"
version = "0.1.0"
description = "XSpeed probe client (xray + speedtest over WebSocket)"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "XSpeed" },
]
dependencies = [
    "websockets>=13.1",
    "httpx[socks]>=0.27.2",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "anyio>=4.6.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
runtime = []

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[project.scripts]
xspeed-probe = "xspeed_probe.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xspeed_probe"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S"]
ignore = [
    "S101",
    "S104",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S105", "S106", "S108"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"