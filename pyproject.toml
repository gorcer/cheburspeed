[project]
name = "xspeed"
version = "0.1.0"
description = "Сервис мониторинга скорости работы vless соединений"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "XSpeed" },
]

dependencies = []

[tool.uv.workspace]
members = ["server", "probe"]

[dependency-groups]
dev = []

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "ASYNC", "S"]
ignore = [
    "S101",
    "S104",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true